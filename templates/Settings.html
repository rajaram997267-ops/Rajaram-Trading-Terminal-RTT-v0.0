<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RTT v0.0 - Settings</title>
  <style>
    :root { --bg: #0b0e14; --panel: #131722; --border: #1e222d; --text: #e6e9f0; --muted: #6b7280; --green: #00c896; --gold: #ffb800; --red: #ff5370; }
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 24px; }
    .tabbar { display: flex; gap: 4px; margin: 20px 0; border-bottom: 1px solid var(--border); }
    .tabbar a { padding: 10px 18px; color: var(--muted); font-size: 14px; font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; text-decoration: none; }
    .tabbar a.active { color: var(--text); border-bottom-color: var(--green); }
    .settings-box { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .settings-box input[type=text] { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; font-family: monospace; }
    button { background: var(--green); color: #06110d; border: none; padding: 9px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
    button.secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
    .token-status { font-size: 12px; color: var(--muted); }
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border); transition: .2s; border-radius: 22px; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: var(--text); transition: .2s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--green); }
    input:checked + .slider:before { transform: translateX(18px); }
  </style>
</head>
<body>
  <div>
    <h2>Settings <span style="color: var(--muted); font-weight: 400; font-size: 14px;">RTT v0.0</span></h2>
  </div>

  <div class="tabbar">
    <a href="/">Dashboard</a>
    <a href="/paper-trading">Paper Trading</a>
    <a href="/live-trading">Live Trading</a>
    <a href="/settings" class="active">Settings</a>
  </div>

  <!-- EXIT STRATEGY SELECTION -->
  <div class="settings-box">
    <span>Exit strategy for new trades:</span>
    <select id="strategySelect" style="background: var(--bg); color: var(--text); padding: 8px; border-radius: 6px;" onchange="setStrategy(this.value)">
      <option value="TRAIL_FROM_2" {% if exit_strategy == "TRAIL_FROM_2" %}selected{% endif %}>Standard Trailing Stop</option>
      <option value="MOMENTUM_CONFIRMED" {% if exit_strategy == "MOMENTUM_CONFIRMED" %}selected{% endif %}>10) RSI-EMA Dual Momentum</option>
    </select>
  </div>

  <!-- MOMENTUM CONFIGURATION BOX -->
  <div class="settings-box" style="border: 1px solid var(--gold);">
    <strong style="color: var(--gold); margin-right: 10px;">Momentum Config (Strategy #10):</strong>
    <span>Period:</span>
    <input type="text" id="momoRsiPeriod" style="width: 45px; text-align: center;" value="{{ momo_rsi_period }}">
    <span>Call RSI < :</span>
    <input type="text" id="momoRsiUpper" style="width: 45px; text-align: center;" value="{{ momo_rsi_upper }}">
    <span>Put RSI > :</span>
    <input type="text" id="momoRsiLower" style="width: 45px; text-align: center;" value="{{ momo_rsi_lower }}">
    <span>EMA:</span>
    <input type="text" id="momoEmaPeriod" style="width: 45px; text-align: center;" value="{{ momo_ema_period }}">
    
    <label class="switch" style="margin-left: 15px;">
      <input type="checkbox" id="momoEmergToggle" {% if momo_emergency_enabled %}checked{% endif %}>
      <span class="slider"></span>
    </label>
    <span style="font-size: 13px;">Enable Emergency RSI 50/55 & EMA 20 Overrides</span>
    
    <button class="secondary" style="margin-left: auto;" onclick="saveMomoSettings()">Save Configuration</button>
  </div>

  <script>
    async function saveMomoSettings() {
      const payload = {
        rsi_period: document.getElementById("momoRsiPeriod").value,
        rsi_upper: document.getElementById("momoRsiUpper").value,
        rsi_lower: document.getElementById("momoRsiLower").value,
        ema_period: document.getElementById("momoEmaPeriod").value,
        emergency_enabled: document.getElementById("momoEmergToggle").checked
      };
      const res = await fetch("/api/paper-trading/momo-settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (res.ok) alert("Momentum exit settings updated successfully!");
    }

    async function setStrategy(strategy) {
        await fetch("/api/paper-trading/strategy-toggle", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ strategy })
        });
        location.reload();
    }
  </script>
</body>
</html>
